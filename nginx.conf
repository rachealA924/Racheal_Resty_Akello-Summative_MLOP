# Round-robin load balancer over every "api" container.
# nginx looks up the containers when it starts, so restart it after scaling:
#   docker compose restart nginx
upstream cassava_api {
    server api:7860;
}

server {
    listen 80;
    client_max_body_size 200m;           # bulk uploads

    location / {
        proxy_pass http://cassava_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
