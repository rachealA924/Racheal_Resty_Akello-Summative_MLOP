# Round-robin load balancer over every "api" container.
# nginx looks up the containers when it starts, so restart it after scaling:
#   docker compose restart nginx
upstream cassava_api {
    # max_fails=0: never mark a container as "down" after one slow or failed request.
    # Without it, nginx can mark every container down at once and answer 502 instantly.
    server api:7860 max_fails=0;
    keepalive 32;
}

server {
    listen 80;
    client_max_body_size 200m;           # bulk uploads

    location / {
        proxy_pass http://cassava_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}
